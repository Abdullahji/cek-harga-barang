<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .animate-bounce-slow { animation: bounce 3s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(-5%); animation-timing-function: cubic-bezier(0.8,0,1,1); } 50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-10">

  <div class="max-w-md mx-auto px-4 pt-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-800 uppercase">Cek Harga Barang</h1>
    </div>

    <!-- Loading State -->
    <div id="loader" class="flex items-center justify-center gap-3 p-4 mb-6 bg-amber-50 border border-amber-100 rounded-2xl text-amber-700 shadow-sm">
      <i data-lucide="loader-2" class="animate-spin w-5 h-5"></i>
      <span class="text-sm font-semibold">Menghubungkan ke Database...</span>
    </div>

    <!-- Main Buttons -->
    <div class="space-y-4">
      <button onclick="startScanner()" class="w-full bg-[#8B0000] hover:bg-[#600000] text-white py-4 rounded-2xl font-bold shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
        <i data-lucide="camera"></i> SCAN BARCODE
      </button>

      <div id="scanner-container" class="hidden relative rounded-2xl overflow-hidden bg-black aspect-square shadow-2xl">
        <div id="reader" style="width: 100%"></div>
        <button onclick="stopScanner()" class="absolute top-4 right-4 bg-white/20 backdrop-blur-md p-2 rounded-full text-white">
          <i data-lucide="x-circle"></i>
        </button>
      </div>

      <div class="pt-4 space-y-4">
        <!-- Input Barcode -->
        <div class="relative group">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Barcode Manual</label>
          <div class="flex gap-2">
            <input id="kode" type="text" placeholder="Masukkan Kode..." class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#8B0000] focus:outline-none text-sm font-medium">
            <button onclick="cekKode()" class="bg-slate-800 text-white px-6 font-bold rounded-xl active:scale-95">CEK</button>
          </div>
          <div id="suggestKode" class="absolute z-50 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-2xl hidden"></div>
        </div>

        <!-- Input Nama -->
        <div class="relative group">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Cari Nama</label>
          <div class="flex gap-2">
            <input id="namaSearch" type="text" placeholder="Cari Nama Barang..." class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#8B0000] focus:outline-none text-sm font-medium">
            <button onclick="cekNama()" class="bg-slate-800 text-white px-6 font-bold rounded-xl active:scale-95">CARI</button>
          </div>
          <div id="suggestNama" class="absolute z-50 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-2xl hidden"></div>
        </div>
      </div>

      <button onclick="resetAll()" class="w-full flex items-center justify-center gap-2 py-3 text-slate-400 font-bold hover:text-slate-600">
        <i data-lucide="trash-2" class="w-4 h-4"></i> Hapus
      </button>

      <hr class="border-slate-200">

      <!-- Result Card -->
      <div id="result-card" class="hidden">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden ring-1 ring-slate-100 animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div class="bg-[#8B0000] p-6 text-center">
            <p class="text-[10px] font-bold text-white/60 tracking-[0.2em] uppercase mb-1">Ditemukan</p>
            <h2 id="res-nama" class="text-white text-lg font-black uppercase leading-tight">NAMA BARANG</h2>
          </div>
          <div class="p-6 text-center">
            <div class="bg-slate-50 rounded-2xl mb-6 flex items-center justify-center p-4 min-h-[180px]">
               <img id="res-img" class="max-h-[180px] object-contain hidden">
               <div id="img-placeholder" class="text-slate-300 flex flex-col items-center">
                 <i data-lucide="package-search" class="w-16 h-16 mb-2"></i>
                 <span class="text-[10px] font-bold uppercase tracking-widest">Tidak Ada Foto</span>
               </div>
            </div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Harga Terkini</p>
            <div id="res-harga" class="text-4xl font-black text-emerald-600 tracking-tighter mb-4">Rp 0</div>
            <div id="res-kode" class="inline-block bg-slate-100 px-4 py-1.5 rounded-full text-[10px] font-bold text-slate-500 tracking-widest uppercase">KODE: 12345</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal Interaktif -->
  <div id="modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 text-center shadow-2xl transform transition-all scale-95 opacity-0 duration-300" id="modal-content">
      <div id="modal-icon" class="w-20 h-20 mx-auto mb-6 flex items-center justify-center rounded-full"></div>
      <h3 id="modal-title" class="text-xl font-extrabold mb-2 text-slate-800">Judul</h3>
      <p id="modal-msg" class="text-slate-500 font-medium mb-8 leading-relaxed">Pesan error atau info disini.</p>
      <button onclick="closeModal()" id="modal-btn" class="w-full py-4 rounded-2xl text-white font-bold text-lg shadow-lg active:scale-95 transition-transform">Tutup</button>
    </div>
  </div>

  <script>
    let data = {};
    let isReady = false;
    let html5QrCode;

    // Inisialisasi Ikon Lucide
    lucide.createIcons();

    // Fungsi Load Data
    function loadData() {
      if (typeof google !== "undefined" && google.script) {
        google.script.run.withSuccessHandler(res => {
          data = res;
          isReady = true;
          document.getElementById('loader').classList.add('hidden');
        }).getData();
      } else {
        // Fallback untuk testing browser biasa
        fetch("https://script.google.com/macros/s/AKfycbw2GBe6YRDvTiq07vWojw1dPWwIgvPVrgTmAVUHwOhCFU7bzII-mFQtdUSsYN7o9H8-_A/exec?api=1")
          .then(res => res.json())
          .then(res => {
            data = res;
            isReady = true;
            document.getElementById('loader').classList.add('hidden');
          });
      }
    }
    loadData();

    // Modal Controller
    function showModal(title, msg, type = 'error') {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');
      const icon = document.getElementById('modal-icon');
      const btn = document.getElementById('modal-btn');
      
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-msg').innerText = msg;
      
      modal.classList.remove('hidden');
      setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);
      setTimeout(() => content.classList.replace('opacity-0', 'opacity-100'), 10);

      if (type === 'error') {
        icon.className = "w-20 h-20 mx-auto mb-6 flex items-center justify-center rounded-full bg-red-100 text-red-600";
        icon.innerHTML = '<i data-lucide="x-circle" style="width:40px;height:40px"></i>';
        btn.className = "w-full py-4 rounded-2xl text-white font-bold text-lg shadow-lg bg-[#8B0000]";
      } else {
        icon.className = "w-20 h-20 mx-auto mb-6 flex items-center justify-center rounded-full bg-amber-100 text-amber-600";
        icon.innerHTML = '<i data-lucide="alert-circle" style="width:40px;height:40px"></i>';
        btn.className = "w-full py-4 rounded-2xl text-white font-bold text-lg shadow-lg bg-amber-600";
      }
      lucide.createIcons();
    }

    function closeModal() {
      const content = document.getElementById('modal-content');
      content.classList.replace('scale-100', 'scale-95');
      content.classList.replace('opacity-100', 'opacity-0');
      setTimeout(() => document.getElementById('modal').classList.add('hidden'), 300);
    }

    // Logic Tampil Data
    function formatIDR(val) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
    }

    function display(key) {
      const item = data[key];
      if (!item) return;

      document.getElementById('result-card').classList.remove('hidden');
      document.getElementById('res-nama').innerText = item.nama;
      document.getElementById('res-harga').innerText = formatIDR(item.harga);
      document.getElementById('res-kode').innerText = "KODE: " + key;

      const img = document.getElementById('res-img');
      const placeholder = document.getElementById('img-placeholder');
      
      if (item.gambar) {
        let driveId = item.gambar.match(/[-\w]{25,}/);
        img.src = driveId ? "https://drive.google.com/thumbnail?id=" + driveId[0] + "&sz=w1000" : item.gambar;
        img.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        img.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }
      
      document.getElementById('kode').value = key;
      document.getElementById('namaSearch').value = item.nama;
      hideSuggest();
    }

    // Event Handlers
    function cekKode() {
      let val = document.getElementById('kode').value;
      if (data[val]) display(val);
      else showModal("Barang Tidak Ada", `Kode ${val} tidak ditemukan di database.`, 'error');
    }

    function cekNama() {
      let val = document.getElementById('namaSearch').value.toLowerCase();
      let key = Object.keys(data).find(k => data[k].nama.toLowerCase().includes(val));
      if (key) display(key);
      else showModal("Pencarian Gagal", "Barang dengan nama tersebut tidak ditemukan.", 'warning');
    }

    // Scanner
    function startScanner() {
      if (!isReady) return;
      document.getElementById('scanner-container').classList.remove('hidden');
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
        decodedText => {
          stopScanner();
          display(decodedText);
        }
      );
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          document.getElementById('scanner-container').classList.add('hidden');
        });
      }
    }

    // Autocomplete
    function hideSuggest() {
      document.getElementById('suggestKode').classList.add('hidden');
      document.getElementById('suggestNama').classList.add('hidden');
    }

    document.getElementById('kode').addEventListener('input', e => {
      let val = e.target.value.toLowerCase();
      if (!val) return hideSuggest();
      let matches = Object.keys(data).filter(k => k.includes(val)).slice(0, 5);
      let list = document.getElementById('suggestKode');
      list.innerHTML = matches.map(k => `<div onclick="display('${k}')" class="p-4 border-b border-slate-50 hover:bg-slate-50 cursor-pointer"><div class="text-[10px] font-bold text-[#8B0000] uppercase">${k}</div><div class="text-sm font-medium text-slate-600">${data[k].nama}</div></div>`).join('');
      list.classList.remove('hidden');
    });

    document.getElementById('namaSearch').addEventListener('input', e => {
      let val = e.target.value.toLowerCase();
      if (!val) return hideSuggest();
      let matches = Object.keys(data).filter(k => data[k].nama.toLowerCase().includes(val)).slice(0, 5);
      let list = document.getElementById('suggestNama');
      list.innerHTML = matches.map(k => `<div onclick="display('${k}')" class="p-4 border-b border-slate-50 hover:bg-slate-50 cursor-pointer"><div class="text-sm font-bold text-slate-700">${data[k].nama}</div><div class="text-[10px] font-medium text-slate-400 uppercase tracking-widest">${k}</div></div>`).join('');
      list.classList.remove('hidden');
    });

    function resetAll() {
      document.getElementById('kode').value = "";
      document.getElementById('namaSearch').value = "";
      document.getElementById('result-card').classList.add('hidden');
      hideSuggest();
    }
  </script>
</body>
</html>
